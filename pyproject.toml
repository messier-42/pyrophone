[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "Pyrophone"
version = "0.1.0.dev0"
description = "Python message routing DSL environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6,<7",
]
license = "Apache-2.0"
license-files = ["doc/LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/messier-42/pyrophone"
Issues = "https://github.com/messier-42/pyrophone/issues"

[project.optional-dependencies]
cabe = ["PyCABE>=0.1.0.dev0"]
mqtt = ["aiomqtt>=2.4,<3"]
amqp = []
redis = []
xmpp = []
irc = []

[dependency-groups]
dev = [
    "mypy>=1.15",
    "types-PyYAML>=6,<7",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyrophone"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/doc/LICENSE"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
