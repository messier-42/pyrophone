name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_type == 'tag' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    name: Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: make dev
      - name: Run tests, lint, and type checks
        run: make check

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - name: Read the package version from the release tag
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
        id: version
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os
          from pathlib import Path

          from packaging.version import InvalidVersion, Version

          tag = os.environ["GITHUB_REF_NAME"]
          try:
              version = Version(tag.removeprefix("v"))
          except InvalidVersion as error:
              raise SystemExit(f"Release tag {tag!r} must contain a valid version.") from error
          if version.local is not None:
              raise SystemExit(f"PyPI does not accept local version {str(version)!r}.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"version={version}", file=output)
              print(f"prerelease={str(version.is_prerelease).lower()}", file=output)
          PY
      - name: Build source distribution and wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYROPHONE: ${{ steps.version.outputs.version }}
        run: uv build --no-sources
      - name: Verify the built wheel
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv
          uv pip install dist/*.whl
          uv pip check
          .venv/bin/python -I - <<'PY'
          import os
          from importlib.metadata import version

          import pyrophone

          expected = os.environ["EXPECTED_VERSION"]
          actual = version("Pyrophone")
          if expected and actual != expected:
              raise SystemExit(f"Built Pyrophone {actual}, expected {expected}.")
          PY
      - name: Upload verified distributions
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/Pyrophone/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github:
    name: Create GitHub Release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --verify-tag --generate-notes --prerelease="$PRERELEASE"
